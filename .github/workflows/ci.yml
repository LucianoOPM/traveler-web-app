name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificar:
    name: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql://traveltech:ci-sin-secreto@localhost:5432/traveltech_test
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_USER: traveltech
          POSTGRES_PASSWORD: ci-sin-secreto
        ports:
          - 5432:5432
        # -h 127.0.0.1 fuerza TCP: el servidor temporal de la inicialización solo escucha por socket.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U traveltech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2 # versión de Bun: campo packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run check
      - name: crear bases de PostgreSQL
        run: psql "postgresql://traveltech:ci-sin-secreto@localhost:5432/postgres" -f docker/postgres/init/01-crear-bases.sql
      - run: bun run test
      - name: build
        run: bun run build
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://traveltech:ci-sin-secreto@localhost:5432/traveltech_private
          DEMO_DATABASE_URL: postgresql://traveltech:ci-sin-secreto@localhost:5432/traveltech_demo
          AUTH_SECRET: ci-auth-secret-ficticio-solo-para-ci-0123456789
          APP_ORIGIN: http://localhost:4321
          PRIVATE_STORAGE_DIR: ./storage/private
          DEMO_STORAGE_DIR: ./storage/demo
          AGENCY_TIMEZONE: America/Mexico_City
