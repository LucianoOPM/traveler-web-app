# PostgreSQL local para desarrollo (H1). No es una configuración de producción:
# el usuario `traveltech` es superusuario y el puerto solo se publica en 127.0.0.1.
name: traveltech

services:
  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: traveltech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env (ver .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - traveltech_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 fuerza TCP: el servidor temporal de la inicialización solo escucha por socket,
      # así que el servicio no se declara sano hasta que las bases ya existen.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U traveltech -d traveltech_test"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  traveltech_pgdata:
